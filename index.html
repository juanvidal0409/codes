<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supermercado</title>
  <meta name="description" content="Supermercado en línea: productos frescos, despensa y más, con entrega a domicilio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand" aria-label="Ir al inicio">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-name" data-store-name>Supermercado</span>
          <span class="brand-tagline" data-store-tagline></span>
        </span>
      </a>

      <form class="header-search" role="search" id="header-search">
        <label for="header-search-input" class="visually-hidden">Buscar productos</label>
        <input id="header-search-input" type="search" placeholder="Buscar productos…" autocomplete="off">
        <button type="submit" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </form>

      <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>

      <nav id="main-nav" class="main-nav" aria-label="Principal">
        <a href="#/" data-nav="inicio">Inicio</a>
        <a href="#/productos" data-nav="productos">Productos</a>
        <a href="#/productos?ofertas=1" data-nav="ofertas">Ofertas</a>
        <a href="#/admin" data-nav="admin" class="nav-admin">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Administrador
        </a>
        <a href="#/carrito" data-nav="carrito" class="nav-cart">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="20" r="1.3" fill="currentColor"/><circle cx="17.5" cy="20" r="1.3" fill="currentColor"/></svg>
          Carrito
          <span class="cart-count" data-cart-count>0</span>
        </a>
      </nav>
    </div>
  </header>

  <main id="main" class="site-main" tabindex="-1">
    <div id="app"></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <p class="footer-title" data-store-name>Supermercado</p>
        <p class="muted" data-store-tagline></p>
      </div>
      <div>
        <p class="footer-heading">Contacto</p>
        <ul class="footer-list">
          <li data-store-address></li>
          <li data-store-phone></li>
          <li data-store-email></li>
        </ul>
      </div>
      <div>
        <p class="footer-heading">Horario</p>
        <p class="muted" data-store-hours></p>
      </div>
      <div>
        <p class="footer-heading">Medios de pago</p>
        <ul class="footer-list" data-footer-payments></ul>
      </div>
    </div>
    <div class="container footer-bottom">
      <span>© <span data-year></span> <span data-store-name>Supermercado</span>. Todos los derechos reservados.</span>
    </div>
  </footer>

  <div class="toast-region" aria-live="polite" aria-atomic="false" id="toasts"></div>

  <dialog class="modal" id="confirm-dialog">
    <form method="dialog" class="modal-body">
      <h2 class="modal-title" id="confirm-title">Confirmar</h2>
      <p id="confirm-message"></p>
      <div class="modal-actions">
        <button value="cancel" class="btn btn-ghost">Cancelar</button>
        <button value="ok" class="btn btn-danger" id="confirm-ok">Confirmar</button>
      </div>
    </form>
  </dialog>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
